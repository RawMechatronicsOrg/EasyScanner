[package]
name = "easyscanner-core"
version = "0.1.0"
edition = "2024"
description = "EasyScanner native core: OpenCV ChArUco pose + calibration, the per-frame engine, and the JNI bridge"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
scan-algo = { path = "../algo" }
opencv = { version = "0.101.1", default-features = false, features = ["calib3d", "objdetect", "imgproc", "clang-runtime"] }
jni = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
